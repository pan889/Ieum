# Docker Compose 단일 노드가 이 프로젝트의 1급 배포 경로다 (D-11 확정).
# 개발용. 운영 오버라이드는 deploy/compose/ 참조.
name: ieum

x-api-env: &api-env
  IEUM_ENV: ${IEUM_ENV:-development}
  IEUM_DEBUG: ${IEUM_DEBUG:-true}
  IEUM_SECRET_KEY: ${IEUM_SECRET_KEY:?IEUM_SECRET_KEY 가 필요하다. make secret 참조}
  IEUM_BASE_URL: ${IEUM_BASE_URL:-http://localhost:5173}
  # API 가 **밖에서 보이는** 주소. SAML 은 IdP 가 우리 ACS 로 직접 POST 하고
  # 메타데이터에 그 주소를 적어 두므로, 화면 주소로는 안 된다. 운영에서는 보통
  # 화면과 같은 오리진이라 비워 두지만, 개발은 포트가 갈린다.
  IEUM_API_URL: ${IEUM_API_URL:-http://localhost:8000}
  # 브라우저 오리진은 MinIO 와 **같은 변수**에서 온다. 둘로 나누면 한쪽만
  # 고쳐 두고 CORS 프리플라이트에서 막힌다 (실제로 그랬다: API 는 기본값
  # localhost 만 허용해서 127.0.0.1 로 연 브라우저가 로그인부터 실패했다).
  IEUM_CORS_ORIGINS: ${IEUM_WEB_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  IEUM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ieum
  IEUM_REDIS_URL: redis://redis:6379/0
  IEUM_S3_ENDPOINT_URL: http://minio:9000
  # presigned URL 은 브라우저가 연다. 컨테이너 이름으로 서명하면 브라우저가
  # 그 호스트를 못 찾아 업로드가 통째로 죽는다.
  IEUM_S3_PUBLIC_ENDPOINT_URL: ${IEUM_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  IEUM_S3_BUCKET: ${IEUM_S3_BUCKET:-ieum-attachments}
  IEUM_S3_ACCESS_KEY: ${IEUM_S3_ACCESS_KEY:-minioadmin}
  IEUM_S3_SECRET_KEY: ${IEUM_S3_SECRET_KEY:-minioadmin}
  IEUM_SMTP_HOST: mailpit
  IEUM_SMTP_PORT: "1025"
  IEUM_SMTP_TLS: "false"
  # **2FA 를 갖춘 관리자.** CI 의 E2E 잡은 이 계정을 시드하는데 개발 스택은
  # 안 했다 — 그래서 step-up 이 걸린 화면(역할·IdP·워크플로우, 그리고 M4 의
  # SLA 정책)을 CI 는 몰 수 있고 손으로는 열 수 없었다. `conventions.md` 의
  # "CI 의 E2E 는 개발 스택과 같은 대역을 세운다" 를 **거울로 뒤집은** 종류다:
  # 개발 스택이 CI 보다 적게 세우면, CI 에서만 되는 화면이 생긴다.
  #
  # 개발·시험용 값이다. 운영 오버라이드(deploy/compose/prod.yml)에는 없다.
  SEED_MFA_ADMIN_EMAIL: ${SEED_MFA_ADMIN_EMAIL:-mfa-admin@example.com}
  SEED_MFA_ADMIN_PASSWORD: ${SEED_MFA_ADMIN_PASSWORD:-seed-mfa-admin-password-1234}
  SEED_MFA_ADMIN_TOTP_SECRET: ${SEED_MFA_ADMIN_TOTP_SECRET:-IEUMDEVSEEDTOTPSECRET234}

services:
  postgres:
    # PGroonga 포함 이미지. 한글 전문검색은 M2 에서 쓰지만 확장은 처음부터 깔아둔다.
    image: groonga/pgroonga:4.0.1-alpine-16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ieum
      # 정렬 콜레이션은 ko_KR 기준 (docs/architecture/i18n.md 6절)
      LANG: ko_KR.UTF-8
    ports: ["5432:5432"]
    volumes:
      - ieum_pgdata:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ieum"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [ieum_redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${IEUM_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${IEUM_S3_SECRET_KEY:-minioadmin}
      # 브라우저가 스토리지로 직접 올린다(서버는 바이트를 경유하지 않는다).
      # MinIO 는 S3 의 CORS API 를 구현하지 않아서 `mc cors set` 이 통하지
      # 않는다 — 오리진은 여기서 정한다. 기본값이 `*` 라 안 적어도 개발은
      # 돌아가지만, 기본값에 기대면 언제 바뀌는지 모른다.
      MINIO_API_CORS_ALLOW_ORIGIN: ${IEUM_WEB_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports: ["9000:9000", "9001:9001"]
    volumes: [ieum_miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 버킷 자동 생성 후 종료
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    # 배열 형태로 쓴다. YAML 접기 스칼라(`>`)는 줄바꿈을 없애서 여러 줄
    # 스크립트가 한 줄로 뭉개진다 — 예전에 여기서 조용히 깨졌다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MC_USER" "$$MC_PASSWORD"
        mc mb --ignore-existing "local/$$BUCKET"
        echo "버킷 준비 완료: $$BUCKET"
    environment:
      MC_USER: ${IEUM_S3_ACCESS_KEY:-minioadmin}
      MC_PASSWORD: ${IEUM_S3_SECRET_KEY:-minioadmin}
      BUCKET: ${IEUM_S3_BUCKET:-ieum-attachments}
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_MAX_MESSAGES: "5000"

  # 개발·시험용 가짜 OIDC IdP. mailpit·MinIO 와 같은 자리의 도구다 — 실제
  # IdP 없이 SSO 경로 전체를 돌린다. api 이미지를 그대로 쓴다(pyjwt 가 이미
  # 들어 있다). 운영 오버라이드(deploy/compose/)에는 없다.
  fake-idp:
    # api 이미지를 그대로 쓴다. pyjwt·cryptography 가 이미 들어 있고, 가짜
    # IdP 를 위해 이미지를 하나 더 만들 이유가 없다. `image` 이름은 컴포즈가
    # api 를 빌드할 때 붙이는 것과 같다 — 그래서 `up` 한 번으로 둘 다 선다.
    image: ieum-api:latest
    command: ["python", "/app/fake-idp/idp.py"]
    depends_on:
      api: {condition: service_started}
    environment:
      # `iss` 는 **브라우저가 보는 주소**여야 한다. 서버는 컴포즈 네트워크
      # 안에서 서비스 이름으로 오지만, 토큰의 발급자는 하나뿐이다.
      FAKE_IDP_ISSUER: ${IEUM_FAKE_IDP_ISSUER:-http://localhost:9099}
    ports: ["9099:9099"]
    volumes:
      - ./deploy/compose/fake-idp:/app/fake-idp:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment: *api-env
    command: ["uvicorn", "ieum.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    ports: ["8000:8000"]
    volumes:
      - ./apps/api/src:/app/src
      - ./packages/i18n:/app/packages/i18n:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment: *api-env
    command: ["arq", "ieum.worker.settings.WorkerSettings"]
    volumes:
      - ./apps/api/src:/app/src
      - ./packages/i18n:/app/packages/i18n:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @ieum/web dev --host 0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      # 스토어를 볼륨으로 뺀다. 저장소를 통째로 마운트하므로 기본 위치
      # (`.pnpm-store`)에 두면 수백 MB 가 작업 트리에 쌓인다.
      PNPM_HOME: /pnpm
      npm_config_store_dir: /pnpm/store
      # 컨테이너에는 TTY 가 없다. pnpm 이 node_modules 를 지워야 할 때
      # (락파일·스토어가 바뀐 경우) 확인을 못 받아 그냥 멈춘다.
      npm_config_confirm_modules_purge: "false"
    ports: ["5173:5173"]
    volumes:
      - .:/app
      - ieum_node_modules:/app/node_modules
      - ieum_pnpm_store:/pnpm

volumes:
  ieum_pgdata:
  ieum_redisdata:
  ieum_miniodata:
  ieum_node_modules:
  ieum_pnpm_store:
