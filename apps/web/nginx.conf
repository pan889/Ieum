# 소켓 업그레이드. `Connection: upgrade` 는 **홉마다** 다시 써 줘야 한다 —
# 프록시가 그대로 흘려보내는 헤더가 아니다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA. 서버 렌더링이 없으므로 알 수 없는 경로는 index.html 로 넘긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 는 같은 오리진으로 프록시한다. 세션 쿠키(SameSite=Lax)가 그대로 붙는다.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **동시 편집이 여기로 온다.** 위키 소켓은 같은 오리진의 `/api/...` 다
        # (`collab.ts` 는 `VITE_API_BASE_URL` 이 비면 `window.location.origin`
        # 을 쓴다 — 운영 이미지가 정확히 그 경우다). 업그레이드 헤더가 없으면
        # 핸드셰이크가 평범한 GET 으로 올라가 실패하고, 화면에는 "연결 중" 만
        # 남는다. 개발 스택은 Vite 프록시가 이 일을 대신해 줘서 안 보인다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 소켓은 오래 조용하다. 기본값(60초)이면 아무도 안 치는 문서에서
        # 1분마다 끊기고 다시 붙는다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # **올라오는 것 중 제일 큰 것에 맞춘다.** 위키 묶음 임포트가 50MB
        # (`portable.py MAX_ARCHIVE_BYTES`), 첨부 25MB. nginx 기본값은 1MB 라
        # 그대로 두면 앱이 허용하는 크기를 프록시가 413 으로 자른다.
        client_max_body_size 64m;
    }

    # 배포마다 다른 자리를 여기서 덧붙인다. 지금은 번들 MinIO 를 같은 오리진에
    # 붙이는 설치본(`deploy/install/`)이 쓴다. 아무것도 안 붙이면 빈 글롭이라
    # nginx 는 그냥 지나간다.
    include /etc/nginx/ieum-extra/*.conf;

    # 해시가 붙은 자산은 영구 캐시, index.html 은 캐시하지 않는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 글꼴은 파일 이름에 해시가 없다(업스트림이 준 이름 그대로 싣는다).
    # `/assets/` 규칙에 안 걸리므로 여기서 따로 캐시한다 — 없으면 한 화면을
    # 열 때마다 조각 열몇 개를 매번 되물어 온다.
    #
    # `immutable` 은 안 쓴다. 판을 올려 글꼴을 갈아 끼웠는데 브라우저가 1년
    # 동안 안 물어보면 옛 글꼴이 남는다. 갈아 끼울 때는 경로를 바꾼다.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
