[alembic]
script_location = %(here)s/src/ieum/db/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# 파일명에 날짜를 넣어 정렬이 눈으로도 맞게 한다.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
# sqlalchemy.url 은 env.py 가 Settings 에서 읽는다. 여기 비밀정보를 두지 않는다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
