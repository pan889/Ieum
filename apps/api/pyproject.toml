[project]
name = "ieum-api"
version = "0.1.0"
description = "Ieum — 셀프호스팅 팀 협업 플랫폼 API"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }

dependencies = [
    # 웹
    "fastapi>=0.118,<0.121",
    "uvicorn[standard]>=0.38,<0.40",
    "python-multipart>=0.0.20",
    # 설정·검증
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "email-validator>=2.2",
    # DB
    "sqlalchemy[asyncio]>=2.0.44,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "uuid6>=2024.7.10", # UUIDv7 (D-10)
    # 인증
    "argon2-cffi>=25.1", # argon2id
    "pyotp>=2.9", # TOTP
    "qrcode[pil]>=8.0", # 2FA 등록 QR
    "cryptography>=46.0", # AES-GCM 애플리케이션 레벨 암호화
    # 질의 언어 (IQL). EBNF/LALR 파서.
    "lark>=1.3",
    # 마크다운 정본 (ADR-0008). 클라이언트도 markdown-it 계열을 써서
    # 방언이 갈라지지 않게 한다 (wiki-markdown.md 1절).
    "markdown-it-py>=3.0,<5",
    "mdit-py-plugins>=0.4,<0.6",
    # 정규화기(md → md). 직접 만들면 표·중첩 목록에서 틀린다.
    "mdformat>=0.7.22,<0.8",
    "mdformat-gfm>=0.4,<0.5",
    "mdformat-frontmatter>=2.0,<3",
    "mdformat-footnote>=0.1.1,<0.2",
    # front matter 읽기·쓰기. mdformat-frontmatter 를 통해 들어오기도 하지만
    # 우리가 직접 import 하므로 직접 선언한다 — 남의 전이 의존에 기대면
    # 그쪽이 바꿀 때 조용히 깨진다.
    "pyyaml>=6.0",
    # 캐시·큐
    "redis[hiredis]>=5.2,<6", # arq 0.28 이 redis<6 을 요구한다
    "arq>=0.26",
    # 오브젝트 스토리지 (S3/MinIO). presigned URL 서명은 로컬 계산이라
    # 동기 boto3 로 충분하다. 실제 I/O(HEAD/DELETE)만 스레드로 넘긴다 —
    # aiobotocore 는 botocore 를 좁게 핀해서 의존성 충돌을 자주 만든다.
    "boto3>=1.36",
    # 메일 발송
    "aiosmtplib>=4.0",
    # 웹훅 전송. **런타임 의존이다** — 워커의 전송 태스크가 import 한다.
    # dev 에만 두면 개발 환경에서는 멀쩡하고 컨테이너에서만 워커가 죽는다.
    "httpx>=0.28",
    # 관측성
    # OIDC ID 토큰 검증. 흐름(PKCE·state·nonce)은 우리가 직접 들고 서명 검증만
    # 맡긴다 — 인증 경계를 프레임워크에 통째로 넘기면 무엇을 검사하는지 안 읽힌다.
    "pyjwt[crypto]>=2.10",
    # WebAuthn/패스키. **여기도 직접 만들지 않는다** — 어테스테이션 검증과
    # COSE 공개키 파싱은 규격이 넓고, 틀리면 "서명을 확인했다" 가 거짓이 된다.
    "webauthn>=2.5,<4",
    # SAML 2.0. **여기는 직접 만들지 않는다.** XML 서명 검증은 정규화(c14n)와
    # 서명 래핑 공격(XSW)이 얽혀 있어, 손으로 쓰면 "서명이 붙어 있다" 와
    # "이 문서가 서명됐다" 를 구분하지 못한다. 어설션 암호화(xmlenc)도 같다.
    "python3-saml>=1.16,<2",
    "structlog>=25.4",
    "prometheus-client>=0.24",
    # i18n (서버측 알림·메일 렌더)
    "babel>=2.17",
    "pycrdt>=0.14.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "moto[s3,server]>=5.0",  # 실제 S3 없이 presigned 업로드 전체 경로를 돈다
    "testcontainers[postgres]>=4.13",
    "bandit>=1.9",
    "types-qrcode>=8.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ieum"]

[tool.uv]
default-groups = []

# ── ruff ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy-imports (모듈 경계 강제에 사용)
    "RUF",
    "ASYNC",
    "S",         # bandit
]
ignore = [
    "S101",   # assert — 테스트에서 사용
    "B008",   # FastAPI Depends 기본값 패턴
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]   # 테스트 안의 더미 비밀번호
# 마이그레이션은 autogenerate 결과물이다. 사람이 검토하되 포맷은 강제하지 않는다.
"src/ieum/db/migrations/versions/*" = ["E501"]

# CLAUDE.md 절대규칙 1(모듈 경계를 넘는 import 금지)은 ruff 로 표현할 수 없다.
# banned-api 는 "같은 모듈 안에서는 허용"을 구분하지 못해 자기 내부 import 까지 막는다.
# 대신 tests/test_module_boundaries.py 가 AST 로 정확히 검사한다.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["ieum"]

[tool.ruff.format]
quote-style = "double"

# ── mypy ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ieum"]

[[tool.mypy.overrides]]
# boto3/botocore 는 타입 스텁을 따로 배포한다(boto3-stubs). 전체를 깔면
# 설치가 무거워지므로, 우리가 쓰는 좁은 표면은 storage.py 안에서 좁혔다.
#
# onelogin(python3-saml)·xmlsec 은 스텁이 없다. 그래서 `saml.py` 가 타입
# 경계다 — 라이브러리와 닿는 자리를 그 파일 안으로 몰아 두고, 밖으로는
# 우리 dataclass 만 내보낸다. 이 override 를 다른 모듈로 넓히지 않는다.
module = [
    "arq.*",
    "testcontainers.*",
    "boto3.*",
    "botocore.*",
    "moto.*",
    "onelogin.*",
    "xmlsec.*",
]
ignore_missing_imports = true

# ── pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# 테스트도 같은 루프에서 돌아야 세션 스코프 엔진의 커넥션을 공유할 수 있다.
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: 실제 DB 를 쓰는 API 통합 테스트",
]

# ── bandit ──────────────────────────────────────────────────────
# Low 심각도는 게이트로 삼지 않는다. 현재 걸리는 것은 전부 검토를 마쳤다:
#   B101 assert — 타입 좁히기용. -O 로 벗겨져도 뒤에서 다른 예외가 난다
#   B105 "hardcoded password" — 권한 상수 이름과 HKDF 용도 라벨. 비밀정보가 아니다
# medium 이상이 하나라도 나오면 CI 를 세운다.
[tool.bandit]
exclude_dirs = ["tests", "src/ieum/db/migrations"]

[tool.coverage.run]
source = ["ieum"]
omit = ["*/db/migrations/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
