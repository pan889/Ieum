# 운영 오버라이드. 개발용 코드 마운트와 핫리로드를 제거한다.
services:
  api:
    build:
      target: runtime
    command: ["uvicorn", "ieum.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    volumes: []
    environment:
      IEUM_ENV: production
      IEUM_DEBUG: "false"
      # presigned URL 은 브라우저가 연다. 개발 기본값(`localhost:9000`)이 그대로
      # 넘어오면 운영에서 아무도 못 여는 링크를 조용히 계속 발급한다.
      IEUM_S3_PUBLIC_ENDPOINT_URL: "${IEUM_S3_PUBLIC_ENDPOINT_URL:?브라우저가 접근할 스토리지 주소가 필요하다. 예) https://files.example.com}"
      # 개발 기본값은 localhost 다. 운영 오리진을 안 넣으면 브라우저가 API 를
      # 부르는 족족 프리플라이트에서 막혀 앱이 통째로 안 뜬다.
      IEUM_CORS_ORIGINS: "${IEUM_WEB_ORIGINS:?웹 오리진이 필요하다. 예) https://ieum.example.com}"
    restart: unless-stopped

  worker:
    build:
      target: runtime
    volumes: []
    environment:
      IEUM_ENV: production
      IEUM_DEBUG: "false"
    restart: unless-stopped
    healthcheck:
      # **api 이미지를 그대로 쓰므로 이미지의 HEALTHCHECK 를 물려받는다** —
      # 그것은 `/healthz` 를 두드리는데 워커는 HTTP 를 안 연다. 덮어쓰지 않으면
      # 워커는 영원히 unhealthy 이고, `up --wait` 은 멀쩡한 스택에서 실패한다.
      #
      # arq 가 Redis 에 남기는 기록을 읽는다. 기록은 30초마다 갱신되고
      # (`WorkerSettings.health_check_interval`) 수명이 31초라, 멈춰 선
      # 워커는 여기서 붉어진다.
      test: ["CMD", "arq", "--check", "ieum.worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: []
    volumes: []
    ports: ["80:80"]
    restart: unless-stopped

  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
    environment:
      # 개발 기본값은 localhost 다. 운영 오리진을 안 넣으면 브라우저 업로드가
      # 프리플라이트에서 막힌다.
      MINIO_API_CORS_ALLOW_ORIGIN: "${IEUM_WEB_ORIGINS:?웹 오리진이 필요하다. 예) https://ieum.example.com}"
