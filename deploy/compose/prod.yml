# 운영 오버라이드. 개발용 코드 마운트와 핫리로드를 제거한다.
services:
  api:
    build:
      target: runtime
    command: ["uvicorn", "ieum.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    volumes: []
    environment:
      IEUM_ENV: production
      IEUM_DEBUG: "false"
    restart: unless-stopped

  worker:
    build:
      target: runtime
    volumes: []
    environment:
      IEUM_ENV: production
      IEUM_DEBUG: "false"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: []
    volumes: []
    ports: ["80:80"]
    restart: unless-stopped

  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
