{{/* 정적 파일만 준다. nginx 가 SPA 를 서빙하고 `/api` 를 API 로 넘긴다. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ieum.fullname" . }}-web
  labels:
    {{- include "ieum.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "ieum.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "ieum.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ieum.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "ieum.webImage" . }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            # nginx 가 `/api/`·`/scim/` 을 넘길 곳. 이미지의 기본값은 compose 의
            # 서비스 이름(`api:8000`)이라, 여기서 안 주면 nginx 가 그 이름을 못
            # 찾아 기동하자마자 죽는다 — web 파드가 기동 루프에 빠진다.
            # 포트는 `api.yaml` 의 Service 포트와 같아야 한다.
            - name: IEUM_API_UPSTREAM
              value: "{{ include "ieum.fullname" . }}-api:8000"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ieum.fullname" . }}-web
  labels:
    {{- include "ieum.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ieum.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
