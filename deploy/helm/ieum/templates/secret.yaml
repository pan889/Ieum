{{- if not .Values.secrets.existingSecret }}
{{/*
값으로 받은 비밀. **운영에서는 이 파일이 만들어지지 않게 한다** —
`secrets.existingSecret` 을 주면 차트는 그것을 가리키기만 한다.

`helm get values` 로 되읽히고 릴리스 이력에 남으므로, 여기 들어간 값은
"클러스터 안에 평문으로 한 벌 더 있다" 고 봐야 한다.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ieum.fullname" . }}-secrets
  labels:
    {{- include "ieum.labels" . | nindent 4 }}
type: Opaque
stringData:
  IEUM_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  IEUM_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  IEUM_REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- with .Values.secrets.opensearchPassword }}
  IEUM_OPENSEARCH_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
