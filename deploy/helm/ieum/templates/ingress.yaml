{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.enabled 면 ingress.host 가 필요하다." -}}
{{- end }}
{{/*
경로가 **API 먼저**다. `/` 를 먼저 두면 그것이 `/api` 까지 삼켜 앱이 자기
API 를 못 부른다 — 라우터 순서와 같은 함정이다(고정 경로를 `{id}` 형제보다
위에 두는 규칙).

동시 편집이 웹소켓을 쓴다. 인그레스 컨트롤러마다 업그레이드를 켜는 방법이
다르므로(nginx 는 기본으로 되고, 어떤 것은 애노테이션이 필요하다)
`ingress.annotations` 로 넘기게 두었다.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ieum.fullname" . }}
  labels:
    {{- include "ieum.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.enabled 면 ingress.tls.secretName 이 필요하다." .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ieum.fullname" . }}-api
                port:
                  number: 8000
          # 코드 호스트가 두드리는 문(A22)은 **따로 열지 않는다.** 그 라우터는
          # `/api/v1/vcs/...` 에 붙고(설정 화면이 알려 주는 주소도 그것이다)
          # 위의 `/api` 가 이미 덮는다. 예전에 있던 `/vcs` 자리는 앱에 없는
          # 경로라 API 의 404 만 돌려주던 죽은 규칙이었다.
          #
          # SCIM 은 `/api/v1` 아래가 아니다 — 바깥이 정한 규약이라 경로를 우리가
          # 못 고른다(module-guide). 웹 이미지의 nginx 도 같은 자리를 넘긴다.
          - path: /scim
            pathType: Prefix
            backend:
              service:
                name: {{ include "ieum.fullname" . }}-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ieum.fullname" . }}-web
                port:
                  number: 80
{{- end }}
