{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ieum.serviceAccountName" . }}
  labels:
    {{- include "ieum.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# 이 앱은 쿠버네티스 API 를 부르지 않는다. 토큰을 안 매달면 파드가 뚫려도
# 클러스터를 향해 할 수 있는 일이 없다.
automountServiceAccountToken: false
{{- end }}
