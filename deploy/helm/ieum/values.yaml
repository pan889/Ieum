# 이음 차트의 값.
#
# **붙는 것(Postgres·Redis·S3·SMTP)은 이 차트가 만들지 않는다.** 주소만 받는다.
# 이유는 `README.ko.md` 에 적어 두었다 — 요약하면, 이 차트가 데이터베이스를
# 소유하면 `helm uninstall` 이 데이터를 지우고, 운영 DB 는 백업과 이중화를
# 따로 받아야 한다.

image:
  repository: ghcr.io/pan889/ieum-api
  tag: ""            # 비우면 `Chart.appVersion`
  pullPolicy: IfNotPresent
web:
  image:
    repository: ghcr.io/pan889/ieum-web
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 2
  # uvicorn 워커 수. 파드 하나가 쓰는 CPU 를 정하므로 `resources` 와 함께 본다.
  workers: 4
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

worker:
  # **여러 개 띄워도 된다.** 근거가 셋이다:
  #
  # 1. 아웃박스 폴링이 `FOR UPDATE SKIP LOCKED` 다 — 같은 이벤트를 두 번
  #    보내지 않는다 (`core/outbox.py`).
  # 2. 주기 작업(스윕·다이제스트)은 arq 의 `unique` 크론이라 job id 가
  #    실행 시각으로 정해진다 — 워커 넷이 같은 것을 넣으면 하나만 큐에
  #    들어간다. 다이제스트가 워커 수만큼 나가지 않는 이유가 이것이다.
  # 3. 기동 직후 스윕은 워커마다 한 번 돌 수 있다(`run_at_startup`). 스윕은
  #    15초마다 도는 멱등 작업이라 한 번 더 도는 것이 문제가 아니다.
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

# 마이그레이션. **Job 으로 돌린다** (initContainer 가 아니다).
#
# initContainer 로 두면 파드 수만큼 동시에 `alembic upgrade` 가 돌아 서로
# 경쟁한다. Alembic 은 그것을 막아 주지 않는다. Helm 훅 Job 은 앱이 뜨기
# **전에** 한 번만 돈다.
migrate:
  enabled: true
  # 실패한 Job 을 남긴다. 지우면 왜 실패했는지 볼 수 없다.
  keepFailed: true
  backoffLimit: 1
  activeDeadlineSeconds: 600

# 설치 직후 내장 역할·워크플로우를 만든다. **다시 돌려도 안전하다**(멱등).
seed:
  enabled: true
  # 첫 관리자의 메일. 비우면 시드의 기본값(`admin@example.com`)이다.
  # 비밀번호는 `secrets.seedAdminPassword`(또는 `existingSecret` 의
  # `SEED_ADMIN_PASSWORD` 키)로 준다 — **안 주면 관리자가 안 만들어진다.**
  # 같은 메일의 사용자가 이미 있으면 시드는 그 사람을 건드리지 않는다.
  adminEmail: ""

config:
  # **필수.** 사람이 브라우저에 치는 앱 주소. 메일 안의 링크, SSO 가 IdP 에
  # 알려 주는 돌아올 주소가 이것에서 나온다. 비우면 배포가 실패한다 — 안
  # 실패시키면 앱이 개발 기본값(`http://localhost:5173`)으로 뜬다.
  baseUrl: ""
  # 브라우저가 앱을 여는 오리진(콤마로 여럿). CORS 가 이것으로 결정된다.
  # 보통 `baseUrl` 과 같은 값이다.
  webOrigins: ""
  # 브라우저가 첨부를 여는 스토리지 주소. presigned URL 에 실린다.
  s3PublicEndpointUrl: ""
  # **앱이** 스토리지를 부르는 주소(클러스터 안에서 보이는 것).
  # 예) `http://minio.storage.svc:9000`. 비우면 AWS S3 의 기본 주소로 간다.
  # 열쇠는 `secrets.s3AccessKey`·`secrets.s3SecretKey` 다.
  s3EndpointUrl: ""
  s3Bucket: ieum-attachments
  s3Region: us-east-1
  # 접속자 IP 를 읽을 때 믿는 프록시 수(`X-Forwarded-For` 를 오른쪽에서 이만큼).
  # 인그레스가 `/api` 를 API 로 바로 넘기므로 1. 인그레스 앞에 L7 로드밸런서가
  # 하나 더 있으면 2. 틀리게 작으면 모두가 한 주소로 보여 로그인 제한이 전원을
  # 막고, 틀리게 크면 접속자가 IP 를 꾸밀 수 있다.
  trustedProxyHops: 1
  # 그 밖의 `IEUM_*` 설정을 그대로 넘긴다. 메일(`IEUM_SMTP_HOST`·
  # `IEUM_SMTP_PORT`·`IEUM_SMTP_TLS`·`IEUM_SMTP_USER`·`IEUM_MAIL_FROM`)이
  # 여기로 온다 — 비밀번호는 `secrets.extra.IEUM_SMTP_PASSWORD`.
  # 위에서 차트가 정하는 키와 겹치면 **차트의 값이 이긴다.**
  extra: {}

# 검색 백엔드 (ADR-0005, ADR-0015).
#
# **이 차트는 OpenSearch 를 만들지 않는다.** Postgres·Redis·S3 와 같은 이유다:
# 클러스터는 백업·이중화·버전 올리기를 따로 받아야 하고, `helm uninstall` 이
# 색인을 지우는 명령이 되면 안 된다.
#
# 기본값 `postgres` 는 아무것도 더 필요 없다(PGroonga 가 이미 그 안에 있다).
# `opensearch` 로 바꾸면 색인은 여전히 Postgres 에 쓰이고 OpenSearch 는 그것을
# 비추는 읽기 쪽이 된다 — 그래서 되돌릴 때 되색인이 필요 없다.
#
# 바꾼 뒤 **한 번은 `ieum reindex` 를 돌려야 한다.** 켜기 전에 쌓인 것은 미러
# 큐에 없다.
search:
  backend: postgres
  opensearch:
    url: ""
    index: ieum-search
    # 본문 분석기. `cjk` 는 루씬에 들어 있어 플러그인 없이 돌지만 한국어를
    # 두 글자씩 쪼갠다. `analysis-nori` 를 설치한 이미지라면 `nori` 로
    # 바꾼다 — 바꾸면 되색인이 필요하다(분석기는 색인 시점에 적용된다).
    analyzer: cjk
    username: ""

# 비밀. **운영에서는 `existingSecret` 을 쓴다.**
#
# 아래 값에 직접 적으면 `values.yaml` 이 비밀 창고가 되고, 그 파일은 대개
# git 에 들어간다. 그래서 기본은 비어 있고, 비어 있으면 차트가 뜨지 않는다.
secrets:
  existingSecret: ""
  # `existingSecret` 이 비었을 때만 쓴다. 개발·시험용이다.
  secretKey: ""
  databaseUrl: ""
  redisUrl: ""
  # `search.backend: opensearch` 이고 클러스터가 비밀번호를 요구할 때만.
  opensearchPassword: ""
  # 스토리지 열쇠. IAM 역할(IRSA·워크로드 아이덴티티)로 붙는 S3 라면 비운다 —
  # 비우면 앱이 기본 자격 증명 체인을 쓴다. `existingSecret` 에서는
  # `IEUM_S3_ACCESS_KEY`·`IEUM_S3_SECRET_KEY` 키다(없어도 된다).
  s3AccessKey: ""
  s3SecretKey: ""
  # 첫 관리자의 비밀번호(`seed.adminEmail`). 들어가서 바꾼 뒤에는 지워도 된다.
  # `existingSecret` 에서는 `SEED_ADMIN_PASSWORD` 키다(없어도 된다).
  seedAdminPassword: ""
  extra: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
