name: 릴리스

on:
  push:
    tags: ['v*']
  # **태그를 밀 수 없는 자리에서도 판을 낼 수 있어야 한다.**
  #
  # 이 저장소를 다루는 자동화 환경 중에는 git 게이트웨이가 태그 ref 를
  # 거절하는 곳이 있다(브랜치 푸시는 통과하는데 태그만 403 이다 — 받아
  # 확인했다). 그러면 "태그를 밀어야만 릴리스가 나간다" 는 설계가 판을
  # 내는 일마다 **사람 하나를 반드시 거치게** 만든다.
  #
  # 손으로 돌릴 때는 태그를 여기서 만든다 — `action-gh-release` 가 없는
  # 태그를 지금 커밋에 붙여 준다. 그래서 **어느 ref 에서 돌리는지가 곧
  # 릴리스가 가리킬 커밋**이다. 아래 guard 가 그 나무의 `pyproject.toml`
  # 과 판이 맞는지 보므로, 엉뚱한 브랜치에서 돌리면 거기서 멈춘다.
  workflow_dispatch:
    inputs:
      version:
        description: '낼 판. 예) 1.0.0 (앞의 v 는 붙이지 않는다)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  guard:
    # **태그와 선언된 판이 같은가.** 다르면 여기서 멈춘다 — 태그는 사람이
    # 손으로 붙이는 것이고, `v1.0.0` 을 붙였는데 `pyproject.toml` 이
    # `0.9.0` 이면 그 이미지는 자기 판을 잘못 말한다. 그리고 그 오류는
    # 한참 뒤에 "어느 판이 돌고 있냐" 를 못 믿게 되는 것으로 나타난다.
    name: 태그와 판이 맞는가
    runs-on: ubuntu-latest
    outputs:
      # 이미지에 적는 판. 사전 공개면 꼬리까지 그대로 들어간다.
      version: ${{ steps.check.outputs.version }}
      # 릴리스 판. `pyproject.toml` 과 맞추고 CHANGELOG 절을 찾는 데 쓴다.
      core: ${{ steps.check.outputs.core }}
      # 릴리스와 태그의 이름(`v` 가 붙은 쪽).
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          # 입력을 **환경변수로** 받는다. `${{ }}` 를 셸 줄 안에 그대로 펴면
          # 사람이 적은 값이 그 자리에서 스크립트가 된다.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_VERSION#v}"
            echo "손으로 돌린다: ${GITHUB_REF_NAME} (${GITHUB_SHA}) 에 v${tag} 를 붙인다"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          # `1.0.0-rc1` 의 릴리스 판은 `1.0.0` 이다. 사전 공개는 **그 판을
          # 향하는 후보**이므로 선언과 맞춰야 하는 것은 꼬리를 뗀 쪽이다.
          # `pyproject.toml` 에 `1.0.0-rc1` 을 적을 수는 없다 —
          # `test_version_agrees.py` 가 MAJOR.MINOR.PATCH 를 요구하고,
          # 그 규칙이 있는 이유는 차트와 JS 패키지가 같은 값을 손으로 적기
          # 때문이다.
          core="${tag%%-*}"
          declared=$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('apps/api/pyproject.toml').read_text())['project']['version'])
          ")
          echo "태그: $tag / 릴리스 판: $core / 선언: $declared"
          if [ "$core" != "$declared" ]; then
            echo "::error::태그의 릴리스 판($core)과 apps/api/pyproject.toml($declared)이 다르다"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "tag=v$tag" >> "$GITHUB_OUTPUT"

      - name: 나머지 선언도 같은가
        # 게이트가 이미 있다. 릴리스에서 한 번 더 부르는 이유: CI 를 건너뛴
        # 태그(예: 다른 브랜치에서 붙인 것)가 여기로 들어올 수 있다.
        #
        # `--noconftest` 가 핵심이다. `apps/api/tests/conftest.py` 는
        # httpx·sqlalchemy·ieum 을 임포트하는데 여기서는 pytest 만 넣는다 —
        # 없으면 **수집 단계에서 exit 4** 로 죽는다(실제로 그렇게 죽는 것을
        # 확인했다). 이 테스트는 픽스처를 하나도 안 쓰므로 conftest 가 필요
        # 없다. 앱을 임포트하는 갈래만 `-k` 로 뺀다.
        run: |
          pip install --quiet pytest
          python -m pytest apps/api/tests/test_version_agrees.py \
            --no-header -p no:cacheprovider --noconftest -k "not running_app"

  images:
    name: 이미지 (ghcr)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          # **`latest` 를 붙이지 않는다.** 운영에서 `latest` 를 가리키면
          # 다시 배포할 때마다 다른 것이 뜨고, 그러면 무엇이 돌고 있는지
          # 말할 수 없다. 판을 적어서 배포한다.
          tags: |
            ghcr.io/${{ github.repository_owner }}/ieum-api:${{ needs.guard.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ieum-web:${{ needs.guard.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notes:
    name: 릴리스 노트
    needs: [guard, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: CHANGELOG 에서 이 판의 절을 뽑는다
        # 노트를 두 곳에 쓰지 않는다. CHANGELOG 가 정본이고 여기서 잘라 온다 —
        # 두 벌을 두면 한 벌만 고쳐지는 날이 온다.
        env:
          RELEASE_CORE: ${{ needs.guard.outputs.core }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, pathlib, re, sys

          # 사전 공개(`v1.0.0-rc1`)에는 자기 절이 없다. 향하는 판의 절을 쓴다.
          version = os.environ["RELEASE_CORE"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(
              rf"^## {re.escape(version)} .*?$(.*?)(?=^## |\Z)", text, re.S | re.M
          )
          if match is None:
              sys.exit(f"CHANGELOG.md 에 '## {version}' 절이 없다")
          pathlib.Path("release-notes.md").write_text(match.group(1).strip() + "\n")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # **`github.ref_name` 이 아니라 guard 가 정한 이름이다.** 손으로
          # 돌리면 ref_name 이 `main` 이고, 그러면 릴리스 제목이 `main` 이
          # 되고 태그는 아예 안 붙는다.
          tag_name: ${{ needs.guard.outputs.tag }}
          name: ${{ needs.guard.outputs.tag }}
          # `v1.0.0-rc1` 처럼 하이픈이 붙은 것은 사전 공개로 둔다.
          prerelease: ${{ contains(needs.guard.outputs.tag, '-') }}
