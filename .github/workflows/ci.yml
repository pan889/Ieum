name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 테스트 전용. 실제 비밀정보가 아니다.
  IEUM_SECRET_KEY: ci-secret-key-at-least-32-characters-long
  IEUM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ieum_test
  IEUM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ieum
  SEED_ADMIN_EMAIL: admin@example.com
  SEED_ADMIN_PASSWORD: ci-admin-password-1234

jobs:
  backend:
    name: 백엔드 (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        # 로컬 compose 와 같은 이미지를 쓴다. PGroonga 유무로 CI 만 통과하는 일이 없게.
        image: groonga/pgroonga:4.0.1-alpine-16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieum
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.17'
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --project apps/api --extra dev --frozen

      - name: 테스트 DB 준비
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE ieum_test;'
          for db in ieum ieum_test; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d "$db" \
              -f deploy/compose/postgres-init/01-extensions.sql
          done

      - name: ruff (lint + format)
        run: |
          uv run --project apps/api ruff check apps/api/src apps/api/tests
          uv run --project apps/api ruff format --check apps/api/src apps/api/tests

      - name: mypy --strict
        # --config-file 없이 워크스페이스 루트에서 돌리면 루트 pyproject.toml 이
        # 잡혀 strict 설정이 통째로 무시된다.
        run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/src

      - name: bandit (보안 정적 분석)
        # -ll = medium 이상만 실패. Low 는 assert 와 상수 이름 오탐이라
        # 게이트로 쓰면 무해한 코드에 CI 가 걸린다 (pyproject 의 [tool.bandit] 참조).
        run: uv run --project apps/api bandit -q -ll -r apps/api/src -x '*/tests/*'

      - name: pytest
        run: uv run --project apps/api pytest apps/api/tests -q --cov=ieum --cov-report=term

      - name: 마이그레이션 검사
        # 모델을 고치고 마이그레이션을 안 만든 경우를 잡는다.
        run: |
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api alembic -c apps/api/alembic.ini check

      - name: 시드 멱등성
        run: |
          uv run --project apps/api python -m ieum.cli seed
          uv run --project apps/api python -m ieum.cli seed

      - name: OpenAPI 스키마 덤프
        run: uv run --project apps/api python -m ieum.cli openapi > apps/api/openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json

  frontend:
    name: 프론트 (eslint · tsc · vitest)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: apps/api

      - name: API 클라이언트 생성
        # 손으로 쓴 인터페이스가 아니라 스키마에서 생성한다 (conventions.md)
        run: pnpm --filter @ieum/api-client run generate

      - name: eslint
        run: pnpm --filter @ieum/web run lint

      - name: tsc
        run: pnpm -r --if-present typecheck

      - name: vitest
        run: pnpm --filter @ieum/web run test

      - name: build
        run: pnpm --filter @ieum/web run build

  e2e:
    name: 브라우저 E2E (playwright)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: groonga/pgroonga:4.0.1-alpine-16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieum
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.17'
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - run: uv sync --project apps/api --extra dev --frozen
      - run: pnpm install --frozen-lockfile

      - name: 브라우저 설치
        run: pnpm --filter @ieum/web exec playwright install --with-deps chromium

      - name: DB 준비
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d ieum \
            -f deploy/compose/postgres-init/01-extensions.sql
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api python -m ieum.cli seed
          # 커스텀 필드 정의를 넣는 관리 화면이 아직 없다. E2E 가 이걸로 쓴다.
          uv run --project apps/api python -m ieum.cli seed-fields

      - name: 스토리지 기동
        # 서비스 컨테이너가 아니라 직접 띄운다. 서비스 컨테이너는 command 를
        # 못 바꿔서 compose 와 다른 이미지를 써야 하는데, 그러면 CI 에서만
        # 통과하는 상황이 생긴다.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ieum -e MINIO_ROOT_PASSWORD=ieum-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done

      - name: 버킷·CORS 준비
        # 브라우저가 프리사인드 URL 로 직접 PUT 한다. CORS 가 없으면 막힌다.
        run: |
          uv run --project apps/api python - <<'PY'
          import boto3
          from botocore.client import Config

          client = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              region_name="us-east-1",
              aws_access_key_id="ieum",
              aws_secret_access_key="ieum-secret",
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
          )
          try:
              client.create_bucket(Bucket="ieum-attachments")
          except client.exceptions.ClientError:
              pass
          client.put_bucket_cors(
              Bucket="ieum-attachments",
              CORSConfiguration={
                  "CORSRules": [
                      {
                          "AllowedHeaders": ["*"],
                          "AllowedMethods": ["PUT", "GET", "HEAD"],
                          "AllowedOrigins": ["*"],
                          "ExposeHeaders": ["ETag"],
                          "MaxAgeSeconds": 3000,
                      }
                  ]
              },
          )
          PY

      - name: api 기동
        env:
          IEUM_S3_ENDPOINT_URL: http://127.0.0.1:9000
          IEUM_S3_ACCESS_KEY: ieum
          IEUM_S3_SECRET_KEY: ieum-secret
          IEUM_S3_BUCKET: ieum-attachments
        run: |
          uv run --project apps/api uvicorn ieum.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "api 가 안 떴다"; cat /tmp/api.log; exit 1

      - name: web 기동
        run: |
          pnpm --filter @ieum/web exec vite --host 127.0.0.1 --port 5173 \
            > /tmp/web.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && exit 0
            sleep 1
          done
          echo "web 이 안 떴다"; cat /tmp/web.log; exit 1

      - name: playwright
        run: pnpm --filter @ieum/web run e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            /tmp/api.log
            /tmp/web.log
          retention-days: 7

  i18n:
    name: i18n 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 키 동기화 · ICU · 하드코딩 탐지
        run: node tools/i18n-check.mjs

  images:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: api 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
