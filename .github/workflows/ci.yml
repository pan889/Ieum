name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 테스트 전용. 실제 비밀정보가 아니다.
  IEUM_SECRET_KEY: ci-secret-key-at-least-32-characters-long
  IEUM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ieum_test
  IEUM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ieum
  SEED_ADMIN_EMAIL: admin@example.com
  SEED_ADMIN_PASSWORD: ci-admin-password-1234

jobs:
  backend:
    name: 백엔드 (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        # 로컬 compose 와 같은 이미지를 쓴다. PGroonga 유무로 CI 만 통과하는 일이 없게.
        image: groonga/pgroonga:4.0.1-alpine-16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieum
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.17'
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --project apps/api --extra dev --frozen

      - name: 테스트 DB 준비
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE ieum_test;'
          for db in ieum ieum_test; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d "$db" \
              -f deploy/compose/postgres-init/01-extensions.sql
          done

      - name: ruff (lint + format)
        run: |
          uv run --project apps/api ruff check apps/api/src apps/api/tests deploy
          uv run --project apps/api ruff format --check apps/api/src apps/api/tests deploy

      - name: mypy --strict
        # --config-file 없이 워크스페이스 루트에서 돌리면 루트 pyproject.toml 이
        # 잡혀 strict 설정이 통째로 무시된다.
        run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/src

      - name: bandit (보안 정적 분석)
        # -ll = medium 이상만 실패. Low 는 assert 와 상수 이름 오탐이라
        # 게이트로 쓰면 무해한 코드에 CI 가 걸린다 (pyproject 의 [tool.bandit] 참조).
        run: |
          uv run --project apps/api bandit -q -ll -r apps/api/src -x '*/tests/*'
          # 개발 스택 도구도 본다. 저장소에 있는 파이썬은 다 검사한다.
          uv run --project apps/api bandit -q -ll -r deploy

      - name: pytest
        run: uv run --project apps/api pytest apps/api/tests -q --cov=ieum --cov-report=term

      - name: 마이그레이션 검사
        # 모델을 고치고 마이그레이션을 안 만든 경우를 잡는다. `server_default`
        # 도 본다 — 마이그레이션이 백필용으로 붙인 것을 모델이 선언하지 않으면
        # 드리프트로 잡힌다. 실제로 넷이 쌓여 있었다.
        run: |
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api alembic -c apps/api/alembic.ini check

      - name: 시드 멱등성
        run: |
          uv run --project apps/api python -m ieum.cli seed
          uv run --project apps/api python -m ieum.cli seed

      - name: OpenAPI 스키마 덤프
        run: uv run --project apps/api python -m ieum.cli openapi > apps/api/openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json

  frontend:
    name: 프론트 (eslint · tsc · vitest)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: apps/api

      - name: API 클라이언트 생성
        # 손으로 쓴 인터페이스가 아니라 스키마에서 생성한다 (conventions.md)
        run: pnpm --filter @ieum/api-client run generate

      - name: eslint
        run: pnpm --filter @ieum/web run lint

      - name: tsc
        run: pnpm -r --if-present typecheck

      - name: vitest
        run: pnpm --filter @ieum/web run test

      - name: build
        run: pnpm --filter @ieum/web run build

  e2e:
    name: 브라우저 E2E (playwright)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: groonga/pgroonga:4.0.1-alpine-16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieum
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.17'
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - run: uv sync --project apps/api --extra dev --frozen
      - run: pnpm install --frozen-lockfile

      - name: 브라우저 설치
        run: pnpm --filter @ieum/web exec playwright install --with-deps chromium

      - name: DB 준비
        env:
          # 2FA 를 갖춘 관리자. step-up 이 필요한 설정(역할·IdP·워크플로우)은
          # 실제로 2FA 를 통과한 세션만 만질 수 있어서, E2E 에는 시크릿을 아는
          # 계정이 하나 필요하다. **이 잡에만 준다** — 백엔드 잡의 pytest 도
          # 같은 시드를 돌리므로, 전역에 두면 테스트 DB 에 사람이 하나 늘어난다.
          SEED_MFA_ADMIN_EMAIL: mfa-admin@example.com
          SEED_MFA_ADMIN_PASSWORD: ci-mfa-admin-password-1234
          SEED_MFA_ADMIN_TOTP_SECRET: IEUMDEVSEEDTOTPSECRET234
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d ieum \
            -f deploy/compose/postgres-init/01-extensions.sql
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api python -m ieum.cli seed
          # 커스텀 필드 정의를 넣는 관리 화면이 아직 없다. E2E 가 이걸로 쓴다.
          uv run --project apps/api python -m ieum.cli seed-fields

      - name: 스토리지 기동
        # 서비스 컨테이너가 아니라 직접 띄운다. 서비스 컨테이너는 command 를
        # 못 바꿔서 compose 와 다른 이미지를 써야 하는데, 그러면 CI 에서만
        # 통과하는 상황이 생긴다.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ieum -e MINIO_ROOT_PASSWORD=ieum-secret \
            -e MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:5173,http://localhost:5173 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          # **못 뜨면 여기서 실패해야 한다.** 그냥 빠져나오면 다음 단계가
          # 연결 오류로 터지고, 로그에는 버킷 만들기가 실패한 것만 남는다 —
          # 원인이 "스토리지가 안 떴다" 라는 것을 알 방법이 없다.
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null && exit 0
            sleep 1
          done
          echo "MinIO 가 안 떴다"; docker logs minio; exit 1

      - name: 메일 상자 기동
        # 초대 스펙은 **실제로 나간 메일을 되읽는다** — 토큰을 몰래 만들어
        # 지름길로 가면 초대 흐름이 죽어 있어도 통과한다(실제로 한동안 죽어
        # 있었다). 그래서 CI 에도 메일 상자가 필요하다. compose 와 같은
        # 이미지·포트를 쓴다.
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 \
            axllent/mailpit:v1.24
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8025/readyz > /dev/null && exit 0
            sleep 1
          done
          echo "mailpit 이 안 떴다"; docker logs mailpit; exit 1

      - name: 버킷 준비
        # 브라우저가 프리사인드 URL 로 직접 PUT 한다. CORS 가 없으면 막히는데,
        # **MinIO 는 S3 의 CORS API(`PutBucketCors`)를 구현하지 않는다** —
        # 여기서 부르면 `NotImplemented` 로 잡이 통째로 죽는다(실제로 죽었다).
        # 오리진은 위 `MINIO_API_CORS_ALLOW_ORIGIN` 이 정한다. compose 도
        # 같은 방식이다 — 두 스택이 다른 길로 CORS 를 맞추면 한쪽만 통한다.
        run: |
          uv run --project apps/api python - <<'PY'
          import boto3
          from botocore.client import Config

          client = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              region_name="us-east-1",
              aws_access_key_id="ieum",
              aws_secret_access_key="ieum-secret",
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
          )
          try:
              client.create_bucket(Bucket="ieum-attachments")
          except (
              # 이미 있는 것만 넘긴다. 자격증명 오류·연결 실패까지 삼키면
              # 업로드 E2E 가 한참 뒤에 알 수 없는 이유로 실패한다.
              client.exceptions.BucketAlreadyOwnedByYou,
              client.exceptions.BucketAlreadyExists,
          ):
              pass
          PY

      - name: api 기동
        env:
          # 브라우저가 실제로 여는 주소로 맞춘다. `localhost` 로 두면 러너에서
          # ::1 로 풀릴 수 있고, uvicorn·vite 는 127.0.0.1 에만 묶여 있다.
          IEUM_BASE_URL: http://127.0.0.1:5173
          # SAML 은 IdP 가 우리 ACS 로 **직접 POST** 한다. 화면 주소로 두면
          # 어설션이 vite 로 날아가 404 가 된다.
          IEUM_API_URL: http://127.0.0.1:8000
          IEUM_S3_ENDPOINT_URL: http://127.0.0.1:9000
          IEUM_S3_ACCESS_KEY: ieum
          IEUM_S3_SECRET_KEY: ieum-secret
          IEUM_S3_BUCKET: ieum-attachments
          IEUM_SMTP_HOST: 127.0.0.1
          IEUM_SMTP_PORT: '1025'
          IEUM_SMTP_TLS: 'false'
        run: |
          uv run --project apps/api uvicorn ieum.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "api 가 안 떴다"; cat /tmp/api.log; exit 1

      - name: 워커 기동
        # **메일은 api 가 보내지 않는다.** 아웃박스에 쌓고 워커가 꺼내 보낸다
        # (그래서 커밋된 것만 나간다). 워커가 없으면 초대 메일이 영원히 오지
        # 않고, 스펙은 "메일이 오지 않았다" 로 3분 뒤에 죽는다.
        env:
          IEUM_BASE_URL: http://127.0.0.1:5173
          IEUM_SMTP_HOST: 127.0.0.1
          IEUM_SMTP_PORT: '1025'
          IEUM_SMTP_TLS: 'false'
        run: |
          uv run --project apps/api arq ieum.worker.settings.WorkerSettings \
            > /tmp/worker.log 2>&1 &
          # arq 는 HTTP 를 안 열어서 헬스 엔드포인트가 없다. 로그의 첫 줄로
          # 기동을 확인한다 — 그냥 넘어가면 뒤에서 "메일이 안 온다" 로만 보인다.
          for _ in $(seq 1 30); do
            grep -q "Starting worker" /tmp/worker.log && exit 0
            sleep 1
          done
          echo "워커가 안 떴다"; cat /tmp/worker.log; exit 1

      - name: web 기동
        run: |
          pnpm --filter @ieum/web exec vite --host 127.0.0.1 --port 5173 \
            > /tmp/web.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && exit 0
            sleep 1
          done
          echo "web 이 안 떴다"; cat /tmp/web.log; exit 1

      - name: 가짜 IdP 기동
        # SSO 스펙이 쓴다. 컴포즈에서는 서비스로 뜨지만 여기서는 프로세스로
        # 띄운다 — api·web 과 같은 방식이다. 브라우저와 api 가 **같은 주소**로
        # 보므로 `iss` 도 그것 하나다.
        run: |
          FAKE_IDP_ISSUER=http://127.0.0.1:9099 \
            uv run --project apps/api python deploy/compose/fake-idp/idp.py \
            > /tmp/fake-idp.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9099/jwks > /dev/null && exit 0
            sleep 1
          done
          echo "가짜 IdP 가 안 떴다"; cat /tmp/fake-idp.log; exit 1

      - name: playwright
        env:
          SEED_MFA_ADMIN_EMAIL: mfa-admin@example.com
          SEED_MFA_ADMIN_PASSWORD: ci-mfa-admin-password-1234
          SEED_MFA_ADMIN_TOTP_SECRET: IEUMDEVSEEDTOTPSECRET234
          E2E_IDP_URL: http://127.0.0.1:9099
          E2E_IDP_INTERNAL_URL: http://127.0.0.1:9099
          # **패스키 스펙은 서버의 rp_id 와 같은 호스트로 열어야 한다.**
          # 서버는 `IEUM_BASE_URL` 의 호스트를 rp_id 로 쓰고(위 api 기동),
          # WebAuthn 자격증명은 그 호스트에 묶인다. 이 값을 비워 두면 스펙이
          # 기본값 `localhost` 로 열어 `127.0.0.1` 짜리 rp_id 와 어긋나고,
          # 인증기는 키를 만드는데 서버는 그것을 받지 않는다 — 목록이 빈
          # 채로 20초를 기다리다 죽는다. CI 에서만 그랬다(개발 스택은 양쪽이
          # `localhost` 다). 아래 `IEUM_BASE_URL` 과 항상 같아야 한다.
          E2E_APP_URL: http://127.0.0.1:5173
        run: pnpm --filter @ieum/web run e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            /tmp/api.log
            /tmp/web.log
            /tmp/worker.log
            /tmp/fake-idp.log
          retention-days: 7

  i18n:
    name: i18n 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 키 동기화 · ICU · 하드코딩 탐지
        run: node tools/i18n-check.mjs

  images:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: api 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
